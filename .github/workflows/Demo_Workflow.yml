name: Demo Workflow

on:
  push:
    branches: [pelin_mihai_adc]
    paths:
      - '.github/workflows/Demo_Workflow.yml'
      - 'drivers/iio/adc/ad5592r_s.c'
      - 'arch/arm/boot/dts/xilinx/zynq-coraz7s-ad5592r-s.dts'


jobs:

  demo_workflow:
    runs-on: pelin_mihai_docker


    env:
      CROSS_COMPILE : arm-linux-gnueabi-
      ARCH: arm

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure Kernel
        run: |
          make zynq_xcomm_adv7511_defconfig

      - name: Build Kernel
        run: |
          make -j$(nproc) UIMAGE_LOADADDR=0x8000 uImage

      - name: Build Device Tree
        run: |
          make xilinx/zynq-coraz7s-ad5592r-s.dtb

      - name: Upload UImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: uImage
          path: arch/arm/boot/uImage

      - name: Upload Device Tree artifact
        uses: actions/upload-artifact@v4
        with:
          name: devicetree.dtb
          path: arch/arm/boot/dts/xilinx/zynq-coraz7s-ad5592r-s.dtb

  demo_checkpatch:
    runs-on: pelin_mihai_docker

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false

      - name: Fetch main branch
        run: git fetch origin main

      - name: Run checkpatch
        run: |
          for commit in $(git rev-list origin/main..HEAD); do
          ./scripts/checkpatch.pl --git "$commit" --ignore FILE_PATH_CHANGES --ignore LONG_LINE --ignore LONG_LINE_STRING --ignore LONG_LINE_COMMENT --strict
          done

  scp_artifacts:
    runs-on: pelin_mihai_docker
    environment: summer_practice_secrets
    needs: [demo_workflow]
    steps:

    - name: Download Kernel Artifact
      uses: actions/download-artifact@v8
      with:
        name: uImage
        path: ./

    - name: Download Device Tree Artifact
      uses: actions/download-artifact@v8
      with:
        name: devicetree.dtb
        path: ./

    - name: Copy artifacts to the Cora Z7
      run: |
        sudo apt-get install -y sshpass
        sshpass -p '${{secrets.pelin_mihai_secret }}' scp -o StrictHostKeyChecking=no uImage root@10.76.84.34:/boot/
        sshpass -p '${{secrets.pelin_mihai_secret }}' scp -o StrictHostKeyChecking=no zynq-coraz7s-ad5592r-s.dtb root@10.76.84.34:/boot/devicetree.dtb

    - name: Reboot the Cora Z7
      run: |
        sshpass -p '${{secrets.pelin_mihai_secret }}' ssh -o StrictHostKeyChecking=no  root@10.76.84.34 'sudo reboot'
