name: Alexandru Iordache ADC

on:
  push:
    branches: alexandru_iordache_adc

jobs:
  alex-workflow:
    runs-on: ubuntu-latest

    env:
      ARCH: arm
      CROSS_COMPILE: arm-linux-gnueabi-
      
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get install -y gcc-arm-linux-gnueabi make bc flex bison libssl-dev u-boot-tools

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Make defconfig
        run: make zynq_xcomm_adv7511_defconfig

      - name: Make .dtb
        run: make xilinx/zynq-coraz7s-ad5592r_s.dtb 

      - name: Make uImage
        run: make -j14 UIMAGE_LOADADDR=0x8000 uImage
      
      - name: Upload dtb artifact
        uses: actions/upload-artifact@v4
        with:
          name: devicetree.dtb
          path: arch/arm/boot/dts/xilinx/zynq-coraz7s-ad5592r_s.dtb

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: uImage
          path: arch/arm/boot/uImage