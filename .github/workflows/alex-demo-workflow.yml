name: Alexandru Iordache ADC

on:
  push:
    branches: alexandru_iordache_adc
    paths:
      - '.github/workflows/alex-demo-workflow.yml'
      - 'drivers/iio/adc/**'
      - 'arch/arm/boot/dts/xilinx/zynq-coraz7s-ad5592r_s.dts'

jobs:
  build-binaries:
    runs-on: alexandru_iordache
    container: burti/linux_container:latest

    env:
      ARCH: arm
      CROSS_COMPILE: arm-linux-gnueabi-

    steps:

      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Make defconfig
        run: make zynq_xcomm_adv7511_defconfig

      - name: Make .dtb
        run: make xilinx/zynq-coraz7s-ad5592r_s.dtb

      - name: Make uImage
        run: make -j$(nproc) UIMAGE_LOADADDR=0x8000 uImage

      - name: Upload dtb artifact
        uses: actions/upload-artifact@v7
        with:
          name: devicetree.dtb
          path: arch/arm/boot/dts/xilinx/zynq-coraz7s-ad5592r_s.dtb

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v7
        with:
          name: uImage
          path: arch/arm/boot/uImage

  run-checkpatch:
    runs-on: alexandru_iordache

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          clean: false

      - name: Fetch main
        run: git fetch origin main

      - name: Run checkpatch script on commits
        run: |
          for commit in $(git rev-list origin/main..HEAD); do
          scripts/checkpatch.pl --git "$commit" --ignore FILE_PATH_CHANGES --ignore LONG_LINE --ignore LONG_LINE_STRING --ignore LONG_LINE_COMMENT --strict
          done

  deploy-to-coraz7s:
    # bind the job to the environment
    environment: summer_practice_secrets
    runs-on: alexandru_iordache
    needs: build-binaries
    steps:
      - name: Download devicetree
        uses: actions/download-artifact@v7
        with:
          name: devicetree.dtb
          path: ./
      - name: Download uImage
        uses: actions/download-artifact@v7
        with:
          name: uImage
          path: ./
      - name: Upload files to coraz7s
        run: |
          sudo apt-get install -y sshpass
          sshpass -p '${{ secrets.alex_secret }}' scp -o StrictHostKeyChecking=no uImage root@10.76.84.31:/boot/
          sshpass -p '${{ secrets.alex_secret }}' scp -o StrictHostKeyChecking=no zynq-coraz7s-ad5592r_s.dtb root@10.76.84.31:/boot/devicetree.dtb
      - name: Reboot the Cora Z7
        run: |
          sshpass -p '${{ secrets.alex_secret }}' ssh -o StrictHostKeyChecking=no root@10.76.84.31 'sudo reboot'
