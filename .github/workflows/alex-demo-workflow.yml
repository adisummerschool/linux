name: sorin test workflow

on:
  push:
    branches: sorin_test
  workflow_dispatch:

jobs:
  alex-workflow:
    runs-on: sorin

    env:
      ARCH: arm
      CROSS_COMPILE: arm-linux-gnueabi-
      
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get install -y gcc-arm-linux-gnueabi make bc flex bison libssl-dev u-boot-tools

      - name: Make defconfig
        run: make zynq_xcomm_adv7511_defconfig

      - name: Make .dtb
        run: make xilinx/zynq-coraz7s-ad5592r_s.dtb 

      - name: Make uImage
        run: make -j$(nproc) UIMAGE_LOADADDR=0x8000 uImage
      
      - name: Upload dtb artifact
        uses: actions/upload-artifact@v7
        with:
          name: devicetree.dtb
          path: arch/arm/boot/dts/xilinx/zynq-coraz7s-ad5592r_s.dtb

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v7
        with:
          name: uImage
          path: arch/arm/boot/uImage

  alex-checkpatch:
    runs-on: sorin

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          clean: false

      - name: Fetch main
        run: git fetch origin main

      - name: Run checkpatch script on commits
        run: |
          for commit in $(git rev-list  origin/main..HEAD); do
            scripts/checkpatch.pl --git "$commit" --ignore FILE_PATH_CHANGES --ignore LONG_LINE --ignore LONG_LINE_STRING --ignore LONG_LINE_COMMENT --strict
          done

  copy-to-coraz7s:
    # bind the job to the environment
    environment: summer_practice_secrets
    runs-on: sorin
    needs: alex-workflow
    steps:
      - run: exit 1
      - name: Download devicetree
        uses: actions/download-artifact@v7
        with:
          name: devicetree.dtb
          path: ./
      - name: Download uImage
        uses: actions/download-artifact@v7
        with:
          name: uImage
          path: ./
      - name: Upload files to coraz7s
        run: |
          ls -l -R
          sshpass -p '${{ secrets.alex_secret }}' scp -o StrictHostKeyChecking=no uImage root@10.76.84.31:/boot/
          sshpass -p '${{ secrets.alex_secret }}' scp -o StrictHostKeyChecking=no zynq-coraz7s-ad5592r_s.dtb root@10.76.84.31:/boot/devicetree.dtb
