name: Alexandru Iordache ADC

on:
  push:
    branches: alexandru_iordache_adc

jobs:
  alex-workflow:
    runs-on: alexandru_iordache

    env:
      ARCH: arm
      CROSS_COMPILE: arm-linux-gnueabi-
      
    steps:

      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Make defconfig
        run: make zynq_xcomm_adv7511_defconfig

      - name: Make .dtb
        run: make xilinx/zynq-coraz7s-ad5592r_s.dtb 

      - name: Make uImage
        run: make -j14 UIMAGE_LOADADDR=0x8000 uImage
      
      - name: Upload dtb artifact
        uses: actions/upload-artifact@v7
        with:
          name: devicetree.dtb
          path: arch/arm/boot/dts/xilinx/zynq-coraz7s-ad5592r_s.dtb

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v7
        with:
          name: uImage
          path: arch/arm/boot/uImage
  
  alex-checkpatch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch main
        run: git fetch origin main

      - name: Run checkpatch script on commits
        run: |
          for commit in $(git rev-list  origin/main..HEAD); do
          scripts/checkpatch.pl --git "$commit" --ignore FILE_PATH_CHANGES --ignore LONG_LINE --ignore LONG_LINE_STRING --ignore LONG_LINE_COMMENT --strict
          done
  