#Workflow name - appears in the Actions tab on GitHub
name: Emilia Pedolu ADC

on:
   push:
      branches: [emilia_pedolu_adc_feature]
      paths:
       - 'github/Workflows/emilia_pedolu_adc.yml'
       - 'drivers/iio/adc/**'
       - 'arch/arm/boot/dts/xilinx/zynq-coraz7s-ad5592r-s.dtb'
jobs:
   checkpath:
      runs-on: emiliapedolu

      steps:

        - name: Checkout source
          uses: actions/checkout@v4
          with:
            fetch-depth: 0
            clean: false

        - name: Fetch main branch
          run: git fetch origin main

        - name: Run checkpath
          run: |
            for commit in "$(git log --oneline emilia_pedolu_adc_feature --not main --format="%h")";do
              scripts/checkpatch.pl --git "$commit" --ignore FILE_PATH_CHANGES --ignore LONG_LINE --ignore LONG_LINE_STRING --ignore LONG_LINE_COMMENT --strict;
            done
          
   build-artifacts:
      runs-on: emiliapedolu
      container: emiliapedolu/dockerhello:latest

      env:
         CROSS_COMPILE: arm-linux-gnueabi-
         ARCH: arm
      
      steps: 
         - name: Checkout source
           uses: actions/checkout@v4
           with:
             fetch-depth: 1

         - name: Build config
           run: |
             make zynq_xcomm_adv7511_defconfig

         - name: Build kernel
           run: |
             make -j$(nproc) UIMAGE_LOADADDR=0x8000 uImage

         - name: Build devicetree 
           run: |
             make xilinx/zynq-coraz7s-ad5592r-s.dtb
             
         - name: Upload_uImage
           uses: actions/upload-artifact@v4
           with:
            name: upload_uImage
            path: arch/arm/boot/uImage

         - name: Upload_devicetree
           uses: actions/upload-artifact@v4
           with:
            name: upload_devicetree
            path: arch/arm/boot/dts/xilinx/zynq-coraz7s-ad5592r-s.dtb
   
   deploy:
      needs: build-artifacts
      environment: summer_practice_secrets
      runs-on: emiliapedolu

      steps:
         - uses: actions/download-artifact@v4
           with:
             path: ./

         - name: Display structure of downloaded files
           run: ls -l ./

         - name: Put device tree and uImage on coraz7s
           run: |
             sshpass -p '${{ secrets.emiliapedolu }}' scp -o StrictHostKeyChecking=no ./uImage-kernel/uImage root@10.76.84.05:/boot/
             sshpass -p '${{ secrets.emiliapedolu }}' scp -o StrictHostKeyChecking=no ./dtb-kernel/zynq-coraz7s-ad5592r-s.dtb root@10.76.84.05:/boot/devicetree.dtb

         - name: Reboot the Cora Z7
           run: |
             sshpass -p '${{ secrets.emiliapedolu }}' ssh -o StrictHostKeyChecking=no root@10.76.84.04 'sudo reboot'