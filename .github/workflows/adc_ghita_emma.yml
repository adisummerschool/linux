name: "ADC_emma_ghita"

on:
  push:
    branches: [ adc_ghita_emma ]
    paths:
      - 'drivers/iio/adc/*'
      - '.github/workflows/adc_ghita_emma.yml'
      - 'arch/arm/boot/dts/xilinx/zynq-coraz7s-ad5592r-s.dts'

# job that builds linux kernel and dtb
jobs:
  build-linux:
    runs-on: emmaghita
    container: emmaghita/hello_docker:latest
    env:
      CROSS_COMPILE: arm-linux-gnueabi-
      ARCH: arm

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Defconfig
        run: |
          make zynq_xcomm_adv7511_defconfig

      - name: Linux kernel
        run: |
          make -j$(nproc) UIMAGE_LOADADDR=0x8000 uImage

    # build device tree
      - name: Device tree
        run: |
          make xilinx/zynq-coraz7s-ad5592r-s.dtb

      - name: Upload linux kernel
        uses: actions/upload-artifact@v4
        with:
          name: uImage
          path: arch/arm/boot/uImage

      - name: Upload device tree
        uses: actions/upload-artifact@v4
        with:
          name: devicetree.dtb
          path: arch/arm/boot/dts/xilinx/zynq-coraz7s-ad5592r-s.dtb

  checkpatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false

      - name: Fetch main branch
        run: git fetch origin main

      - name: Run checkpatch
        run: |
          for commit in $(git rev-list origin/main..HEAD); do
            scripts/checkpatch.pl --git "$commit" --ignore FILE_PATH_CHANGES --ignore LONG_LINE --ignore LONG_LINE_STRING --ignore LONG_LINE_COMMENT --strict;
          done

  on-cora:
    runs-on: emmaghita
    environment: summer_practice_secrets
    needs: [ build-linux ]
    steps:
      - name: Download uImage
        uses: actions/download-artifact@v4
        with:
          name: uImage
          path: ./

      - name: Download devicetree
        uses: actions/download-artifact@v4
        with:
          name: devicetree.dtb
          path: ./

      - name: Deploy on Cora
        run: |
          sshpass -p '${{ secrets.ghita_emma_secret }}' scp -o StrictHostKeyChecking=no uImage root@10.76.84.113:/boot/
          sshpass -p '${{ secrets.ghita_emma_secret }}' scp -o StrictHostKeyChecking=no zynq-coraz7s-ad5592r-s.dtb root@10.76.84.113:/boot/devicetree.dtb

      - name: Reboot on Cora
        run: |
          sshpass -p '${{ secrets.ghita_emma_secret }}' ssh -o StrictHostKeyChecking=no root@10.76.84.113 'reboot'
