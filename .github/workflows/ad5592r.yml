name: doaga_stefan_ADC

on:
  push:
    branches: [ doaga_stefan_adc ]

jobs:
  build-job:
    runs-on: ubuntu-latest

    env:
      CROSS_COMPILE: arm-none-linux-gnueabihf-
      ARCH: arm

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get -q update
          sudo apt-get install -y gcc-arm-linux-gnueabi make bc flex bison libssl-dev u-boot-tools

      - name: Produce artifact
        run: |
          make zynq_xcomm_adv7511_defconfig
          make -j$(nproc) UIMAGE_LOADADDR=0x8000 uImage

      - name: Produce devicetree
        run: |
          make -j$(nproc) xilinx/zynq-coraz7s-ad5592r-s.dtb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: uImage
          path: arch/arm/boot/uImage

      - name: Upload devicetree
        uses: actions/upload-artifact@v4
        with:
          name: zynq-coraz7s-ad5592r-s.dtb
          path: arch/arm/boot/dts/xilinx/zynq-coraz7s-ad5592r-s.dtb
