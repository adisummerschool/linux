name: cucu_maria_ADC

on:
   push:
       branches: [ cucu_maria_adc ]
       paths:
       - 'drivers/iio/adc/**'
       - '.github/workflows/ad5592.yml'
       - 'arch/arm/boot/dts/xilinx/zynq-coraz7s-ad5592r_s.dts'


jobs:
  build-linux:
    runs-on: cucu_maria

    env:
     CROSS_COMPILE: arm-linux-gnueabi-
     ARCH: arm

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get -q update
          sudo apt-get install -y gcc-arm-linux-gnueabi make bc flex bison libssl-dev u-boot-tools
        
      - name: Produce artifact
        run: |
          make zynq_xcomm_adv7511_defconfig
          make -j5 UIMAGE_LOADADDR=0x8000 uImage

      - name: Produce devicetree
        run: |
          make xilinx/zynq-coraz7s-ad5592r-s.dtb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: uImage
          path: arch/arm/boot/uImage

      - name: Upload devicetree
        uses: actions/upload-artifact@v4
        with:
          name: devicetree.dtb
          path: arch/arm/boot/dts/xilinx/zynq-coraz7s-ad5592r-s.dtb

  Checkpatch: 
    runs-on: cucu_maria 

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false

      - name: Checkpatch
        run: |   
          for commit in $(git log cucu_maria_adc --not main --oneline --format="%h"); do
            scripts/checkpatch.pl --git "$commit" --ignore FILE_PATH_CHANGES --ignore LONG_LINE --ignore LONG_LINE_STRING --ignore LONG_LINE_COMMENT --strict
          done

  Binaries:
    runs-on: cucu_maria

    environment: summer_practice_secrets

    needs: [ build-linux ]

    steps:  
      - name: Download uImage
        uses: actions/download-artifact@v4
        with:
          name: uImage
          path: ./

      - name: Download dtb
        uses: actions/download-artifact@v4
        with:
          name: devicetree.dtb
          path: ./

      - name: Download scp
        run: |
         sshpass -p '${{ secrets.lefromage4 }}' scp -o StrictHostKeyChecking=no ./uImage root@10.76.84.9:/boot/
         sshpass -p '${{ secrets.lefromage4 }}' scp -o StrictHostKeyChecking=no ./xilinx/zynq-coraz7s-ad5592r-s.dtb root@10.76.84.9:/boot/

      - name: Reboot on Cora 
        run: |
         sshpass -p '${{ secrets.lefromage4 }}' ssh -o StrictHostKeyChecking=no root@10.76.84.9 'reboot'      
        


        
