name: Tomescu_Lucas_ADC

on:
  push:
    branches:
      - tomescu_lucas_adc

jobs:
  build:
    runs-on: tomescu_lucas_adc
    container: tomesculucas/tomescu_lucas_adc_build:latest

    env:
      ARCH: arm
      CROSS_COMPILE: arm-linux-gnueabi-

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check build dependencies
        run: |
          command -v arm-linux-gnueabi-gcc
          command -v make
          command -v bc
          command -v flex
          command -v bison
          command -v mkimage

      - name: Configure Zynq kernel
        run: |
          make zynq_xcomm_adv7511_defconfig

      - name: Build kernel
        run: |
          make -j9 UIMAGE_LOADADDR=0x8000 uImage

      - name: Build Device Tree
        run: |
          make -j9 xilinx/zynq-coraz7s-ad5592r-s.dtb

      - name: Upload uImage
        uses: actions/upload-artifact@v4
        with:
          name: uImage
          path: arch/arm/boot/uImage

      - name: Upload DTB
        uses: actions/upload-artifact@v4
        with:
          name: dtb
          path: arch/arm/boot/dts/xilinx/zynq-coraz7s-ad5592r-s.dtb

  checkpatch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install checkpatch dependencies
        run: |
          sudo apt-get -q update
          sudo apt-get install -y python3-ply python3-git

      - name: Run checkpatch for branch commits
        run: |
          git fetch origin main

          status=0

          for commit in $(git rev-list origin/main..HEAD); do
            echo "Checking commit: $commit"

            scripts/checkpatch.pl --git "$commit" \
              --ignore FILE_PATH_CHANGES \
              --ignore LONG_LINE \
              --ignore LONG_LINE_STRINGS \
              --ignore LONG_LINE_COMMENT \
              --ignore UNDOCUMENTED_DT_STRING \
              --strict || status=1
          done

          exit $status

  deploy:
    needs: build
    runs-on: tomescu_lucas_adc

    steps:
      - name: Check deploy dependencies
        run: |
          command -v sshpass
          command -v scp
          command -v ssh

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: out/

      - name: Copy uImage to Cora Z7
        run: |
          sshpass -p '${{ secrets.CORA_PASSWORD }}' scp \
            -o StrictHostKeyChecking=no \
            out/uImage/uImage \
            root@10.76.84.32:/boot/uImage

      - name: Copy Device Tree to Cora Z7
        run: |
          sshpass -p '${{ secrets.CORA_PASSWORD }}' scp \
            -o StrictHostKeyChecking=no \
            out/dtb/zynq-coraz7s-ad5592r-s.dtb \
            root@10.76.84.32:/boot/devicetree.dtb

      - name: Reboot Cora Z7
        run: |
          sshpass -p '${{ secrets.CORA_PASSWORD }}' ssh \
            -o StrictHostKeyChecking=no \
            root@10.76.84.32 'reboot'
